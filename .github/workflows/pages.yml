# 把 public/ 佈署到 GitHub Pages（純前端單機遊戲，不需要遊戲伺服器）
name: 佈署前端到 GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "26.12.1"

      - name: 跑測試
        run: npm test

      - uses: actions/configure-pages@v5

      - name: 驗證並注入 GA4 與 SEO
        run: node scripts/inject-seo.cjs

      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
